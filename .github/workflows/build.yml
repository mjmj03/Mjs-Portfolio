name: Build DXVK for Android

on:
  workflow_dispatch:
    inputs:
      dxvk_tag:
        description: "DXVK tag to build (example: v2.7.1 or v3.1.1)"
        default: "v2.7.1"
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout this repo (for optional APK and patches)
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslang-tools zip unzip git python3-pip pkg-config cmake
          pip install --break-system-packages meson

      - name: Build SDL2 for Android (DXVK needs it)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          git clone --depth 1 --branch release-2.30.9 https://github.com/libsdl-org/SDL.git sdl-src
          cmake -S sdl-src -B sdl-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/sdl-install"
          cmake --build sdl-build
          cmake --install sdl-build
          echo "=== SDL2 install ==="
          find sdl-install -name 'libSDL2*' -o -name 'sdl2.pc'

      - name: Get DXVK source
        run: |
          git clone --recursive https://github.com/doitsujin/dxvk.git
          cd dxvk
          git checkout "${{ github.event.inputs.dxvk_tag }}"
          git submodule update --init --recursive

      - name: Apply optional patches (put *.patch files in a patches/ folder)
        run: |
          cd dxvk
          for p in ../patches/*.patch; do
            [ -f "$p" ] && { echo "Applying $p"; git apply "$p"; }
          done || true

      - name: Android patches (SDL name, DXVK_VK_GIPA, Android surface)
        run: |
          cat > android_patch.py <<'PYEOF'
          import re, sys, pathlib
          root = pathlib.Path(sys.argv[1])  # dxvk source dir

          def rw(path, fn):
              p = root / path
              s = p.read_text()
              n = fn(s)
              assert n != s, f"patch made no change: {path}"
              p.write_text(n)
              print("patched", path)

          # 1) SDL library name used on Android
          for p in (root / "src").rglob("*"):
              if p.suffix in (".cpp", ".h"):
                  s = p.read_text(errors="ignore")
                  if "libSDL2-2.0.so.0" in s:
                      p.write_text(s.replace("libSDL2-2.0.so.0", "libSDL2.so"))
                      print("SDL name patched in", p)

          # 2) Use the Vulkan loader the app provides through DXVK_VK_GIPA (hex address)
          def gipa(s):
              marker = "static std::pair<HMODULE, PFN_vkGetInstanceProcAddr> loadVulkanLibrary() {\n"
              assert marker in s, "loadVulkanLibrary not found"
              inject = marker + '''    if (const char* gipaEnv = std::getenv("DXVK_VK_GIPA")) {
                char* end = nullptr;
                unsigned long long addr = std::strtoull(gipaEnv, &end, 16);
                if (addr != 0 && end != gipaEnv) {
                  Logger::info(str::format("Vulkan: Using vkGetInstanceProcAddr from DXVK_VK_GIPA @ 0x", std::hex, addr));
                  return std::make_pair(HMODULE(nullptr), reinterpret_cast<PFN_vkGetInstanceProcAddr>(static_cast<uintptr_t>(addr)));
                }
                Logger::warn("Vulkan: DXVK_VK_GIPA is set but could not be parsed");
              }
          '''
              s = s.replace(marker, inject)
              return s.replace("#include <tuple>\n", "#include <tuple>\n#include <cstdlib>\n#include <cstdint>\n", 1)
          rw("src/vulkan/vulkan_loader.cpp", gipa)

          # 3) Create the surface directly from the Android window, using the app's Vulkan functions
          def inc(s):
              return s.replace("#include <SDL.h>\n", "#include <SDL.h>\n#include <SDL_syswm.h>\n", 1)
          rw("src/wsi/sdl2/wsi_platform_sdl2.h", inc)

          def funcs(s):
              m = re.search(r"^.*SDL_PROC\([^\n]*SDL_GetWindowSize[^\n]*\n", s, re.M)
              assert m, "SDL_GetWindowSize line not found in funcs header"
              add = "SDL_PROC(SDL_bool, SDL_GetWindowWMInfo, (SDL_Window *window, SDL_SysWMinfo *info))\n"
              return s[:m.start()] + add + s[m.start():]
          rw("src/wsi/sdl2/wsi_platform_sdl2_funcs.h", funcs)

          def surf(s):
              pat = re.compile(r"(VkResult Sdl2WsiDriver::createSurface\([^)]*\)\s*\{)(.*?)(\n  \})", re.S)
              m = pat.search(s)
              assert m, "createSurface not found"
              body = '''
              SDL_Window* window = fromHwnd(hWindow);

              SDL_SysWMinfo wmInfo;
              SDL_VERSION(&wmInfo.version);

              if (!SDL_GetWindowWMInfo(window, &wmInfo) || wmInfo.subsystem != SDL_SYSWM_ANDROID) {
                Logger::err("SDL2 WSI: could not get Android window");
                return VK_ERROR_SURFACE_LOST_KHR;
              }

              struct AndroidSurfaceInfo {
                VkStructureType sType;
                const void*     pNext;
                VkFlags         flags;
                void*           window;
              };
              typedef VkResult (VKAPI_PTR *PFN_createAndroidSurface)(
                VkInstance, const AndroidSurfaceInfo*, const VkAllocationCallbacks*, VkSurfaceKHR*);

              auto createFn = reinterpret_cast<PFN_createAndroidSurface>(
                pfnVkGetInstanceProcAddr(instance, "vkCreateAndroidSurfaceKHR"));

              if (!createFn) {
                Logger::err("SDL2 WSI: vkCreateAndroidSurfaceKHR not available");
                return VK_ERROR_EXTENSION_NOT_PRESENT;
              }

              AndroidSurfaceInfo info = { };
              info.sType  = VkStructureType(1000008000); // VK_STRUCTURE_TYPE_ANDROID_SURFACE_CREATE_INFO_KHR
              info.window = wmInfo.info.android.window;

              return createFn(instance, &info, nullptr, pSurface);'''
              return s[:m.start(2)] + body + s[m.end(2):]
          rw("src/wsi/sdl2/wsi_window_sdl2.cpp", surf)
          print("ALL PATCHES OK")
          PYEOF
          python3 android_patch.py dxvk

      - name: Build libdxvk_d3d9.so (Android arm64)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SDLPC="$(dirname "$(find $PWD/sdl-install -name sdl2.pc | head -1)")"
          cd dxvk
          {
            echo "[binaries]"
            echo "c = '$TC/aarch64-linux-android29-clang'"
            echo "cpp = '$TC/aarch64-linux-android29-clang++'"
            echo "ar = '$TC/llvm-ar'"
            echo "strip = '$TC/llvm-strip'"
            echo "pkg-config = 'pkg-config'"
            echo "[host_machine]"
            echo "system = 'android'"
            echo "cpu_family = 'aarch64'"
            echo "cpu = 'aarch64'"
            echo "endian = 'little'"
            echo "[properties]"
            echo "pkg_config_libdir = ['$SDLPC']"
          } > android-arm64.txt
          cat android-arm64.txt

          OPTS=""
          add() { grep -q "option('$1'" meson_options.txt && OPTS="$OPTS -D$1=$2" || true; }
          add native_sdl2 enabled
          add native_glfw disabled
          add native_sdl3 disabled
          add enable_d3d8 false
          add enable_d3d10 false
          add enable_d3d11 false
          add enable_dxgi false
          add enable_d3d9 true
          add enable_tests false
          echo "Using options: $OPTS"

          meson setup build-android --cross-file android-arm64.txt --buildtype release -Dstrip=true $OPTS
          ninja -C build-android
          mkdir -p ../out
          cp "$(find build-android -name 'libdxvk_d3d9.so' | head -1)" ../out/libdxvk_d3d9.so
          "$TC/llvm-strip" --strip-unneeded ../out/libdxvk_d3d9.so
          ls -l ../out
          readelf -d ../out/libdxvk_d3d9.so | grep NEEDED || true

      - name: Repack APK (only if PrototypeMainUp.apk is in the repo)
        run: |
          [ -f PrototypeMainUp.apk ] || { echo "No APK in repo, skipping repack."; exit 0; }
          BT="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)"
          W=$(mktemp -d)
          cp PrototypeMainUp.apk $W/in.apk
          mkdir -p $W/lib/arm64-v8a && cp out/libdxvk_d3d9.so $W/lib/arm64-v8a/
          zip -q -d $W/in.apk 'META-INF/*' 'lib/arm64-v8a/libdxvk_d3d9.so' || true
          (cd $W && zip -q -0 -X in.apk lib/arm64-v8a/libdxvk_d3d9.so)
          $BT/zipalign -f -p 4 $W/in.apk $W/aligned.apk
          keytool -genkeypair -keystore $W/ks.jks -storepass android -keypass android \
            -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android"
          $BT/apksigner sign --ks $W/ks.jks --ks-pass pass:android --key-pass pass:android \
            --out out/PrototypeMainUp-dxvk.apk $W/aligned.apk
          $BT/apksigner verify out/PrototypeMainUp-dxvk.apk && echo "APK OK"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: dxvk-android
          path: out/
